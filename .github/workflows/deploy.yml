name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: crpi-m3ex8dsaem6zwhaf.cn-beijing.personal.cr.aliyuncs.com
  IMAGE_NAME: sjtwebserver/sjtwebserver

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # ACR 不接受 buildx 默认附加的 OCI attestation manifest
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/sjtweb-runtime
            cp .env .env.prev 2>/dev/null || true
            echo "IMAGE_TAG=sha-${{ github.sha }}" > .env

            if ! docker compose pull; then
              cp .env.prev .env 2>/dev/null || true
              exit 1
            fi

            if ! docker compose up -d; then
              cp .env.prev .env 2>/dev/null || true
              docker compose up -d
              exit 1
            fi

            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
                break
              fi
              sleep 1
            done

            HEALTH=$(curl -fsS http://127.0.0.1:8080/healthz 2>/dev/null || true)
            if ! echo "$HEALTH" | grep -q "${{ github.sha }}"; then
              echo "health check failed: $HEALTH"
              cp .env.prev .env 2>/dev/null || true
              docker compose up -d
              exit 1
            fi

            if ! curl -fsS http://127.0.0.1:8080/ >/dev/null \
               || ! curl -fsS http://127.0.0.1:8080/css/style.css >/dev/null; then
              echo "smoke test failed, rolling back"
              cp .env.prev .env 2>/dev/null || true
              docker compose up -d
              exit 1
            fi

            echo "deployed sha-${{ github.sha }}"
