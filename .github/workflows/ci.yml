name: ci

on:
  pull_request:
  push:
    branches: [fast-track, main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
          pip install -r blog/requirements.txt

      - name: Verify
        run: make verify

  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: ASan/UBSan
        run: |
          cmake -S tests -B build/asan -DENABLE_ASAN=ON
          cmake --build build/asan -j
          ctest --test-dir build/asan --output-on-failure

  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      # 新内核 ASLR 熵较高时 TSan 会报 unexpected memory mapping
      - name: Relax ASLR for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: TSan
        run: |
          cmake -S tests -B build/tsan -DENABLE_TSAN=ON
          cmake --build build/tsan -j
          ctest --test-dir build/tsan --output-on-failure

  docker:
    runs-on: ubuntu-24.04
    # 首次填充 GHA 缓存会慢；缓存稳定后可降回 20。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sjtwebserver:ci
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --rm --name sjtweb-ci -p 127.0.0.1:18080:8080 sjtwebserver:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          curl -fsS http://127.0.0.1:18080/sitemap.xml >/dev/null
          curl -fsS http://127.0.0.1:18080/healthz | grep -q "${{ github.sha }}"
          docker logs sjtweb-ci

      - name: Container logs
        if: failure()
        run: docker logs sjtweb-ci || true

      - name: Stop container
        if: always()
        run: docker stop sjtweb-ci || true
