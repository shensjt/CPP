name: ci

on:
  pull_request:
  push:
    branches: [fast-track, main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-yaml python3-pygments

      - name: Verify
        run: make verify
